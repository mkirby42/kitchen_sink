name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  product-guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse quiet edits to product decisions
        env:
          PRODUCT_GUARD_BASE: ${{ github.event.pull_request.base.sha }}
          PRODUCT_GUARD_HEAD: ${{ github.sha }}
          PRODUCT_GUARD_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'product-decision-approved') }}
          GITHUB_EVENT_NAME: pull_request
        run: |
          base="$PRODUCT_GUARD_BASE"
          if git cat-file -e "${base}:scripts/check-product-guards.mjs" 2>/dev/null; then
            git show "${base}:scripts/check-product-guards.mjs" > /tmp/check-product-guards.mjs
          else
            cp scripts/check-product-guards.mjs /tmp/check-product-guards.mjs
          fi
          node /tmp/check-product-guards.mjs

  check:
    runs-on: ubuntu-latest
    env:
      PRODUCT_GUARD_BASE: ${{ github.event.pull_request.base.sha }}
      PRODUCT_GUARD_HEAD: ${{ github.sha }}
      PRODUCT_GUARD_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'product-decision-approved') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse quiet edits to product decisions
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: pull_request
        run: |
          base="$PRODUCT_GUARD_BASE"
          if git cat-file -e "${base}:scripts/check-product-guards.mjs" 2>/dev/null; then
            git show "${base}:scripts/check-product-guards.mjs" > /tmp/check-product-guards.mjs
          else
            cp scripts/check-product-guards.mjs /tmp/check-product-guards.mjs
          fi
          node /tmp/check-product-guards.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Browser tests against the dedicated test Supabase project.
  # Job env overrides the workflow NEXT_PUBLIC_* secrets, which point at production.
  # Deploy does not wait on this job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One shared group so overlapping PR/main runs queue instead of colliding on the
    # shared test Supabase (seed race: "Therapist join has already been completed").
    concurrency:
      group: kitchen-sink-e2e
      cancel-in-progress: false
    # Preinstalled browsers pinned to lockfile 1.64.1; avoids the per-run install hang.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      options: --user 1001
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      RESEND_API_KEY: ""
      RESEND_FROM: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skip when the test Supabase secrets are missing
        id: secrets
        run: |
          if [ -z "$TEST_SUPABASE_URL" ] || [ -z "$TEST_SUPABASE_ANON_KEY" ] || [ -z "$TEST_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "TEST Supabase secrets are not set (TEST_SUPABASE_URL, TEST_SUPABASE_ANON_KEY, TEST_SUPABASE_SERVICE_ROLE_KEY). Skipping browser tests."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          case "$TEST_SUPABASE_URL$NEXT_PUBLIC_SUPABASE_URL" in
            *udgngzzzgrxjxljgtxpf*)
              echo "e2e is pointed at the production project udgngzzzgrxjxljgtxpf. Refusing to run."
              exit 1
              ;;
          esac
      - name: Seed the test project
        if: steps.secrets.outputs.skip != 'true'
        run: npm run seed:test
      - name: Build the app against the test project
        if: steps.secrets.outputs.skip != 'true'
        run: |
          ok=0
          for attempt in 1 2 3; do
            if npm run build; then
              ok=1
              break
            fi
            echo "next build failed (attempt ${attempt}). Retrying the font fetch."
            sleep $((attempt * 5))
          done
          test "$ok" = 1
      - name: Run Playwright
        if: steps.secrets.outputs.skip != 'true'
        run: npx playwright test
      - name: Upload Playwright report
        if: failure() && steps.secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Deploy to Vercel production
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK secret"
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"

  release:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the deploy and publish a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/tag-release.mjs
